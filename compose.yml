name: opsflow
x-app-env: &app-env
  DATABASE_URL: postgresql://opsflow:${POSTGRES_PASSWORD}@postgres:5432/opsflow
  JWT_SECRET: ${JWT_SECRET}
  WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
  SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://opsflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
  N8N_URL: http://n8n:5678
  SIMULATOR_URL: http://simulators:4000
  WEB_ORIGIN: http://localhost:5173
  DEMO_PASSWORD: ${DEMO_PASSWORD:-OpsFlow2026!}
  OTEL_SERVICE_NAME: opsflow-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opsflow
    ports: ['127.0.0.1:5433:5432']
    volumes:
      [
        'postgres_data:/var/lib/postgresql/data',
        './infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-n8n.sql:ro',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsflow -d opsflow']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: opsflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: ['rabbit_data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.14.2
    entrypoint: ['tini', '--', '/bin/sh', '/bootstrap/n8n-entrypoint.sh']
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: opsflow
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_SECURE_COOKIE: 'false'
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Africa/Johannesburg
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    ports: ['127.0.0.1:5678:5678']
    volumes:
      [
        'n8n_data:/home/node/.n8n',
        './workflows:/workflows:ro',
        './infra/n8n-entrypoint.sh:/bootstrap/n8n-entrypoint.sh:ro',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment: *app-env
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      n8n: { condition: service_healthy }
      otel: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    restart: unless-stopped
  simulators:
    build: { context: ., dockerfile: Dockerfile.simulators }
    environment:
      API_URL: http://api:3000
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ['127.0.0.1:5173:80']
    depends_on:
      api: { condition: service_healthy }
      simulators: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  otel:
    image: otel/opentelemetry-collector:0.136.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes: ['./infra/otel/config.yml:/etc/otelcol/config.yml:ro']
    depends_on: [jaeger]
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['127.0.0.1:16686:16686']
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  rabbit_data:
  n8n_data:
